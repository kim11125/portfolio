events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 10M;

    server {
        listen 80;

        # ── 1. 루트 /  ──────────────────────────────────────
        # 빈 다크 페이지. 잘못 들어온 방문자에게 아무것도 노출하지 않음.
        location = / {
            add_header Content-Type 'text/html; charset=utf-8';
            return 200 '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title> </title><style>*{margin:0;padding:0}body{background:#080c18;height:100vh}</style></head><body></body></html>';
        }

        # ── 2. 포트폴리오 (/portfolio) ───────────────────────
        # ^~ : 정규식보다 우선. /portfolio/* 모든 경로 처리.
        location ^~ /portfolio {
            alias /usr/share/nginx/html/portfolio;
            index index.html;
            try_files $uri $uri/ /portfolio/index.html;
            add_header Cache-Control "no-cache";
        }

        # ── 3. 스케줄러 정적 assets (해시 파일명 → 장기 캐시) ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ── 4. 스케줄러 index.html (캐시 금지) ──────────────
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ── 5. 백엔드 API 프록시 ─────────────────────────────
        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 6. 스케줄러 SPA (내부 사용자용, 명시적 경로 진입) ──
        # location = / 가 1번에서 먼저 처리되므로 루트는 여기 오지 않음.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
